<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --deep: #052B42; --lime: #DAFF33; --slate: #42525E; --body: #5B6B78; --grey: #9AA8B2;
  --hair: #C9D6DF; --panel: #F6FAFF; --line: #E1EAF2; --lav: #C1C1FF; --lav-deep: #6E6EDC; --red: #FF4438;
  --ink: #0A0F14; --good: #1F7A4D; --bad: #B3261E; --warn: #8A5A00; --bg: #FFFFFF;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--slate); font: 16px/1.55 Inter, system-ui, sans-serif; }
a { color: var(--deep); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
header.top { background: var(--deep); color: #fff; padding: 22px 0 30px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.wordmark { font-weight: 700; letter-spacing: -0.02em; font-size: 20px; color: #fff; }
.wordmark span { color: var(--lime); }
.pill-internal { background: var(--red); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.kicker { color: var(--lav); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin: 26px 0 8px; }
header.top h1 { color: #fff; font-size: 38px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -0.015em; max-width: 900px; }
.wff { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
.wff div { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 14px 16px; color: #EAF1F6; font-size: 15.5px; line-height: 1.45; }
.wff b { display: block; color: var(--lime); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.meta { color: var(--lav); font-size: 13px; margin-top: 16px; }
nav.pages { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); z-index: 5; }
nav.pages .wrap { display: flex; gap: 22px; overflow-x: auto; padding-top: 12px; padding-bottom: 12px; }
nav.pages a { text-decoration: none; color: var(--grey); font-size: 14px; font-weight: 500; white-space: nowrap; }
nav.pages a:hover { color: var(--deep); }
section.page { padding: 40px 0 16px; }
section.page + section.page { border-top: 1px solid var(--line); }
.pnum { color: var(--grey); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
h2 { color: var(--deep); font-size: 27px; line-height: 1.25; margin: 4px 0 8px; letter-spacing: -0.01em; }
h3 { color: var(--deep); font-size: 18px; margin: 28px 0 10px; }
.lede { font-size: 16.5px; color: var(--slate); max-width: 760px; margin: 0 0 18px; }
.note { color: var(--body); font-size: 13.5px; }
.banner { background: #FFF4F2; border: 1px solid #F6C9C3; color: var(--bad); padding: 10px 14px; border-radius: 10px; margin: 12px 0; font-weight: 500; font-size: 14.5px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.grid { display: grid; gap: 14px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.t-lands, .t-recommended, .t-open_lane, .t-yes { background: #E3F4EA; color: var(--good); }
.t-fails, .t-missing, .t-blocked_by_buyer, .t-failed_checks, .t-table_stakes, .t-no { background: #FBE3E1; color: var(--bad); }
.t-weak, .t-mixed, .t-users_prefer_original, .t-contested, .t-maybe { background: #FDF0DC; color: var(--warn); }
.t-veto { background: var(--deep); color: #fff; }
.chip { display: inline-block; font-size: 12px; font-weight: 500; color: var(--deep); background: #fff; border: 1px solid var(--hair); border-radius: 999px; padding: 2px 9px; margin: 6px 6px 0 0; text-decoration: none; }
.chip.forum { color: var(--warn); border-color: #E8D3A8; }
.sc { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 28px; padding: 0 6px; border-radius: 7px; font-weight: 700; font-size: 13.5px; }
.s1,.s2 { background: #FBE3E1; color: var(--bad); }
.s3 { background: #FDF0DC; color: var(--warn); }
.s4 { background: #EEF2F5; color: var(--slate); }
.s5 { background: #DCEBF3; color: var(--deep); }
.s6 { background: #9EC3D8; color: var(--deep); }
.s7 { background: var(--deep); color: #fff; }
.sx { background: transparent; color: var(--grey); }
.scale { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12.5px; color: var(--body); margin: 4px 0 14px; }
.scale .sc { min-width: 24px; height: 22px; font-size: 12px; }
/* page 1: annotated asset + numbered notes */
.score-layout { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.asset-frame { position: sticky; top: 56px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 1px 2px rgba(5,43,66,0.05); }
.asset-frame .bar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; font-size: 12.5px; color: var(--body); display: flex; justify-content: space-between; gap: 8px; }
.asset-scroll { max-height: calc(100vh - 120px); overflow-y: auto; }
.asset-scroll img { display: block; width: 100%; height: auto; }
.textframe { padding: 18px 20px; font-size: 14.5px; line-height: 1.55; color: var(--ink); }
.textframe p { margin: 0 0 10px; }
.textframe .hd { font-weight: 700; color: var(--deep); }
mark.m { background: #EEF4FF; color: inherit; border: 2px solid var(--deep); border-radius: 6px; padding: 1px 4px; }
.pin { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--deep); color: #fff; font-weight: 700; font-size: 12.5px; flex: 0 0 24px; }
mark.m .pin { width: 20px; height: 20px; font-size: 11px; margin-right: 5px; vertical-align: 1px; }
.notes { display: flex; flex-direction: column; gap: 10px; }
.nrow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.nrow .lab { font-size: 12px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: 0.06em; }
.nrow .msg { color: var(--deep); font-weight: 600; font-size: 14.5px; margin: 2px 0 4px; }
.nrow .crit { color: var(--ink); font-size: 14.5px; }
.nrow .scores { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11.5px; color: var(--body); white-space: nowrap; }
.pillars { margin-top: 24px; }
.pill-card .pn { color: var(--deep); font-weight: 700; font-size: 15.5px; margin: 6px 0 4px; }
.pill-card p { margin: 0; font-size: 14.5px; color: var(--ink); }
table { width: 100%; border-collapse: collapse; }
th { text-align: center; font-size: 11.5px; color: var(--grey); font-weight: 600; padding: 8px 4px; border-bottom: 1px solid var(--hair); vertical-align: bottom; }
th.l { text-align: left; }
th .r { display: block; font-weight: 400; font-style: italic; font-size: 10.5px; color: var(--grey); }
td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; text-align: center; }
td.l { text-align: left; }
td.msgcell { min-width: 250px; }
td.msgcell b { color: var(--deep); display: block; font-size: 13.5px; }
td.msgcell span { color: var(--body); font-size: 12.5px; }
th.gsep, td.gsep { border-left: 2px solid var(--hair); }
.scroll { overflow-x: auto; }
a.plink { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--grey); }
a.plink:hover { color: var(--deep); border-bottom-color: var(--deep); }
/* page 2: slack thread */
.slack { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
.slack .ch { background: var(--deep); color: #fff; padding: 10px 16px; font-weight: 600; font-size: 14.5px; display: flex; justify-content: space-between; }
.slack .ch span { color: var(--lav); font-weight: 400; font-size: 13px; }
.thread { padding: 6px 0 12px; border-top: 1px solid var(--line); }
.thread:first-of-type { border-top: 0; }
.thead { padding: 12px 18px 4px; font-size: 12.5px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: 0.06em; }
.thead b { color: var(--deep); text-transform: none; letter-spacing: 0; font-size: 14.5px; margin-left: 6px; }
.factcheck { margin: 4px 18px 6px; background: #FBFFE6; border: 1px solid #E6F0A8; border-radius: 8px; padding: 7px 11px; font-size: 13.5px; color: var(--ink); }
.factcheck b { color: var(--deep); margin-right: 4px; }
.msgrow { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; padding: 8px 18px; }
.msgrow:hover { background: #FAFCFE; }
.av { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; }
.av.users { background: var(--deep); }
.av.buyers { background: var(--lav-deep); }
.who { color: var(--ink); font-weight: 700; font-size: 14.5px; }
.who .r { font-style: italic; font-weight: 400; color: var(--body); font-size: 12.5px; margin-left: 6px; }
.who .t { color: var(--grey); font-weight: 400; font-size: 12px; margin-left: 6px; }
.txt { color: var(--ink); font-size: 15px; line-height: 1.5; margin-top: 1px; white-space: pre-wrap; }
.txt .q { display: block; border-left: 3px solid var(--hair); padding-left: 10px; color: var(--slate); margin: 2px 0 4px; white-space: normal; }
.reacts { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
.react { font-size: 12px; background: #F1F5F9; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--slate); }
.moved { font-size: 12.5px; color: var(--deep); background: #FBFFE6; border: 1px solid #E6F0A8; border-radius: 8px; padding: 4px 9px; margin-top: 6px; display: inline-block; }
/* page 3: rewrites */
.rw { padding: 20px 0; border-bottom: 1px solid var(--line); }
.rw .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rw .lab { color: var(--grey); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.before { color: var(--body); text-decoration: line-through; text-decoration-color: var(--grey); margin: 10px 0 4px; font-size: 15px; }
.after { color: var(--deep); font-size: 21px; font-weight: 700; line-height: 1.32; margin: 4px 0 10px; letter-spacing: -0.005em; }
.afterrow { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.afterrow .after { flex: 1 1 380px; }
.tile { background: var(--deep); border-radius: 14px; padding: 12px 18px; min-width: 150px; max-width: 240px; }
.tile .fig { display: block; color: var(--lime); font-size: 30px; font-weight: 700; line-height: 1.1; }
.tile .tl { display: block; color: #fff; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }
.kv { font-size: 14px; margin: 6px 0; color: var(--ink); }
.kv b { color: var(--deep); }
.backed { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 8px 0; font-size: 14px; color: var(--ink); }
.backed cite { display: block; font-style: normal; font-size: 12.5px; color: var(--body); margin-top: 4px; }
.delta { font-weight: 700; color: var(--deep); }
ul.tight { margin: 6px 0; padding-left: 20px; }
blockquote { margin: 10px 0 0; padding: 11px 15px; background: #fff; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font-size: 14.5px; }
blockquote cite { display: block; font-style: normal; font-size: 12.5px; color: var(--body); margin-top: 6px; }
/* appendix */
details.app { border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; background: #fff; }
details.app > summary { cursor: pointer; padding: 14px 18px; color: var(--deep); font-weight: 700; font-size: 16px; list-style: none; }
details.app > summary::-webkit-details-marker { display: none; }
details.app > summary::after { content: "+"; float: right; color: var(--grey); font-weight: 400; }
details.app[open] > summary::after { content: "\2212"; }
details.app .inner { padding: 0 18px 18px; }
.stat .v { color: var(--deep); font-size: 30px; font-weight: 700; line-height: 1.1; }
.stat .l { font-size: 13.5px; color: var(--body); }
footer { color: var(--grey); font-size: 13px; padding: 30px 0 60px; }
@media (max-width: 860px) {
  .score-layout, .g3, .g2, .wff { grid-template-columns: 1fr; }
  header.top h1 { font-size: 28px; }
  .wrap { padding: 0 16px; }
}
@media print {
  nav.pages { display: none; }
  section.page { page-break-before: always; }
  section.page:first-of-type { page-break-before: auto; }
  details.app { page-break-inside: avoid; }
  .asset-scroll { max-height: none; }
}
</style>
</head>
<body>
{{BODY}}
</body>
</html>
