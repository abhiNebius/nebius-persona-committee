<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --deep: #052B42; --lime: #DAFF33; --slate: #42525E; --body: #5B6B78; --grey: #9AA8B2;
  --hair: #C9D6DF; --panel: #F6FAFF; --panel-line: #E1EAF2; --lav: #C1C1FF; --red: #FF4438;
  --ink: #0A0F14; --good: #1F7A4D; --bad: #B3261E; --warn: #8A5A00; --bg: #FFFFFF;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--slate); font: 16px/1.55 Inter, system-ui, sans-serif; }
a { color: var(--deep); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
header.top { background: var(--deep); color: #fff; padding: 28px 0 32px; }
header.top .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.wordmark { font-weight: 700; letter-spacing: -0.02em; font-size: 22px; color: #fff; }
.wordmark span { color: var(--lime); }
.pill-internal { background: var(--red); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
header.top .kicker { color: var(--lav); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin: 28px 0 6px; }
header.top h1 { color: #fff; font-size: 34px; line-height: 1.2; margin: 0 0 12px; font-weight: 700; letter-spacing: -0.01em; }
header.top .dek { color: #E6EEF4; font-size: 18px; max-width: 820px; margin: 0; }
header.top .meta { color: var(--lav); font-size: 13px; margin-top: 18px; }
nav.pages { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--panel-line); z-index: 5; }
nav.pages .wrap { display: flex; gap: 22px; overflow-x: auto; padding-top: 12px; padding-bottom: 12px; }
nav.pages a { text-decoration: none; color: var(--grey); font-size: 14px; font-weight: 500; white-space: nowrap; }
nav.pages a:hover { color: var(--deep); }
section.page { padding: 48px 0 24px; }
section.page + section.page { border-top: 1px solid var(--panel-line); }
.pnum { color: var(--grey); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
h2 { color: var(--deep); font-size: 28px; line-height: 1.25; margin: 6px 0 10px; letter-spacing: -0.01em; }
h3 { color: var(--deep); font-size: 19px; margin: 32px 0 10px; }
p.lede { font-size: 18px; color: var(--slate); max-width: 780px; margin: 0 0 20px; }
.banner { background: #FFF4F2; border: 1px solid #F6C9C3; color: var(--bad); padding: 12px 16px; border-radius: 10px; margin: 16px 0; font-weight: 500; }
.note { color: var(--body); font-size: 14px; }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 18px 20px; }
.grid { display: grid; gap: 14px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.chip { display: inline-block; font-size: 12px; font-weight: 500; color: var(--deep); background: #fff; border: 1px solid var(--hair); border-radius: 999px; padding: 2px 9px; margin: 6px 6px 0 0; text-decoration: none; }
.chip.forum { color: var(--warn); border-color: #E8D3A8; }
.change .headline { color: var(--deep); font-weight: 600; margin: 0 0 6px; }
.change p { margin: 0; font-size: 14.5px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grey); font-weight: 600; padding: 10px 8px; border-bottom: 1px solid var(--hair); }
td { padding: 12px 8px; border-bottom: 1px solid var(--panel-line); vertical-align: top; font-size: 14.5px; }
tr.group td { background: var(--panel); color: var(--deep); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px; }
.who { color: var(--deep); font-weight: 600; }
.role { display: block; font-style: italic; color: var(--body); font-weight: 400; font-size: 13px; }
.score { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 30px; border-radius: 8px; font-weight: 700; font-size: 14px; }
.s1,.s2 { background: #FBE3E1; color: var(--bad); }
.s3 { background: #FDF0DC; color: var(--warn); }
.s4 { background: #EEF2F5; color: var(--slate); }
.s5 { background: #DCEBF3; color: var(--deep); }
.s6 { background: #9EC3D8; color: var(--deep); }
.s7 { background: var(--deep); color: #fff; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.t-yes, .t-lands, .t-recommended, .t-open_lane { background: #E3F4EA; color: var(--good); }
.t-no, .t-fails, .t-blocked_by_buyer, .t-failed_checks, .t-table_stakes { background: #FBE3E1; color: var(--bad); }
.t-maybe, .t-mixed, .t-weak, .t-users_prefer_original, .t-contested { background: #FDF0DC; color: var(--warn); }
.scroll { overflow-x: auto; }
/* dialog */
.point { margin: 34px 0 10px; }
.moderator { background: var(--deep); color: #fff; border-radius: 14px; padding: 16px 20px; max-width: 820px; }
.moderator .label { color: var(--lime); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.moderator .q { font-size: 18px; font-weight: 600; margin: 4px 0 4px; }
.moderator .ctx { color: #D5E2EA; font-size: 14px; margin: 0; }
.turn { display: flex; flex-direction: column; max-width: 720px; margin: 18px 0 0; }
.turn.right { margin-left: auto; align-items: flex-end; }
.bubble { position: relative; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 14px 18px; color: var(--ink); font-size: 15.5px; }
.turn.right .bubble { background: #fff; border-color: var(--hair); }
.bubble::after { content: ""; position: absolute; bottom: -9px; left: 26px; width: 16px; height: 16px; background: inherit; border-right: 1px solid var(--panel-line); border-bottom: 1px solid var(--panel-line); transform: rotate(45deg); }
.turn.right .bubble::after { left: auto; right: 26px; border-color: var(--hair); }
.speaker { margin: 14px 8px 0; }
.speaker .n { color: var(--deep); font-weight: 700; font-size: 15px; display: block; }
.speaker .r { font-style: italic; color: var(--body); font-size: 13px; }
.moved { font-size: 13px; color: var(--deep); background: #FFFFE8; border: 1px solid #EEF2B8; border-radius: 8px; padding: 6px 10px; margin-top: 8px; }
.recs { margin-top: 30px; }
.rec .who { display: block; }
.rec p { margin: 8px 0 0; color: var(--ink); }
/* ranking */
.rank { display: grid; grid-template-columns: 34px minmax(160px, 1.3fr) 2fr 170px; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--panel-line); }
.rank > div:last-child { white-space: nowrap; }
.rank .pos { color: var(--grey); font-weight: 700; font-size: 18px; }
.bar { height: 10px; background: #EEF2F5; border-radius: 999px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--deep); border-radius: 999px; }
.stat { text-align: left; }
.stat .v { color: var(--deep); font-size: 34px; font-weight: 700; line-height: 1.1; }
.stat .l { font-size: 14px; color: var(--body); }
/* competitive */
blockquote { margin: 10px 0 0; padding: 12px 16px; background: #fff; border: 1px solid var(--panel-line); border-radius: 10px; color: var(--ink); font-size: 15px; }
blockquote cite { display: block; font-style: normal; font-size: 12.5px; color: var(--body); margin-top: 6px; }
.overlap { padding: 18px 0; border-bottom: 1px solid var(--panel-line); }
.overlap .claim { color: var(--deep); font-weight: 600; margin: 8px 0 4px; }
/* rewrites */
.rw { padding: 22px 0; border-bottom: 1px solid var(--panel-line); }
.before { color: var(--body); text-decoration: line-through; text-decoration-color: var(--grey); }
.after { color: var(--deep); font-size: 20px; font-weight: 600; line-height: 1.35; margin: 6px 0 10px; }
.kv { font-size: 14px; margin: 6px 0; }
.kv b { color: var(--deep); }
ul.tight { margin: 6px 0; padding-left: 20px; }
footer { color: var(--grey); font-size: 13px; padding: 30px 0 60px; }
@media (max-width: 760px) {
  .g3, .g2 { grid-template-columns: 1fr; }
  header.top h1 { font-size: 26px; }
  .rank { grid-template-columns: 26px 1fr 80px; }
  .rank .barcell { display: none; }
  .wrap { padding: 0 16px; }
}
@media print {
  nav.pages { display: none; }
  section.page { page-break-before: always; }
  section.page:first-of-type { page-break-before: auto; }
}
</style>
</head>
<body>
{{BODY}}
</body>
</html>
